<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicalArts — Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (must be a link tag, not @import after other CSS rules) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
    <style>
        /* ── OFFLINE BANNER ── */
        #offline-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99999;
            background: #c0392b;
            color: #fff;
            text-align: center;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            animation: slideDown 0.3s ease;
        }

        #offline-banner.is-online {
            background: #27ae60;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }

            to {
                transform: translateY(0);
            }
        }


        :root {
            --bg: #0d0a00;
            --surface: #1a1200;
            --card: #231800;
            --accent: #E67E22;
            --accent-light: #ff9a76;
            --text: #f5f5f5;
            --gray: #aaaaaa;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 12px;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ─── LOGIN SCREEN ───────────────────────────── */
        #login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #2a1500 0%, #0d0a00 70%);
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-logo i {
            color: var(--accent-light);
        }

        .login-subtitle {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .login-field {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .login-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .login-field input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        .login-field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }

        .login-field .fi {
            position: absolute;
            left: 14px;
            bottom: 13px;
            color: var(--gray);
            font-size: 1rem;
        }

        /* show/hide password toggle */
        .pwd-toggle {
            position: absolute;
            right: 14px;
            bottom: 13px;
            color: var(--gray);
            font-size: 1rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.2s;
        }

        .pwd-toggle:hover {
            color: var(--accent);
        }

        /* loading state on login button */
        .login-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-top: 15px;
            display: none;
        }

        /* ─── ADMIN PANEL ────────────────────────────── */
        #admin-panel {
            display: none;
        }

        /* Header */
        .admin-header {
            background: rgba(26, 18, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 65px;
        }

        .admin-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-nav span {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Main layout */
        .admin-main {
            padding: 30px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .stat-card i {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 4px;
        }

        /* Controls */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 11px 16px 11px 42px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .filter-select {
            padding: 11px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .refresh-btn {
            padding: 11px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .refresh-btn:hover {
            filter: brightness(1.1);
        }

        /* Orders table */
        .orders-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .orders-card-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .orders-card-header h3 {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .orders-card-header span {
            font-size: 0.85rem;
            color: var(--gray);
        }

        /* Loading / Empty */
        .orders-loading,
        .orders-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .orders-loading i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: block;
        }

        .orders-empty i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        /* Table */
        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .orders-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text);
            vertical-align: middle;
        }

        .orders-table tr:last-child td {
            border-bottom: none;
        }

        .orders-table tr:hover td {
            background: rgba(230, 126, 34, 0.04);
        }

        .order-id-badge {
            background: rgba(230, 126, 34, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .img-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .img-thumb:hover {
            transform: scale(1.1);
        }

        .no-img {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            border: 1px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 0.7rem;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .view-btn,
        .del-btn {
            border: none;
            border-radius: 6px;
            padding: 7px 13px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-btn {
            background: rgba(230, 126, 34, 0.15);
            color: var(--accent);
            border: 1px solid rgba(230, 126, 34, 0.3);
        }

        .view-btn:hover {
            background: var(--accent);
            color: white;
        }

        .del-btn {
            background: rgba(231, 76, 60, 0.12);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.25);
        }

        .del-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Responsive table scroll */
        .table-wrap {
            overflow-x: auto;
        }

        /* ─── ORDER DETAIL MODAL ─────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            animation: fadeUp 0.35s ease;
            position: relative;
        }

        .modal-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 10;
        }

        .modal-header h3 {
            font-size: 1.15rem;
            color: var(--accent);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--danger);
            background: rgba(231, 76, 60, 0.1);
        }

        .modal-body {
            padding: 28px;
        }

        .detail-section {
            margin-bottom: 28px;
        }

        .detail-section h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .detail-item label {
            display: block;
            font-size: 0.78rem;
            color: var(--gray);
            margin-bottom: 4px;
        }

        .detail-item span {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
        }

        .detail-item.full {
            grid-column: 1 / -1;
        }

        .price-breakdown {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .price-row.total {
            border-top: 1px solid var(--border);
            margin-top: 8px;
            padding-top: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--accent);
        }

        .ref-img-preview {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            cursor: zoom-in;
        }

        .no-img-placeholder {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: var(--gray);
        }

        .no-img-placeholder i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ─── IMAGE ZOOM MODAL ───────────────────────── */
        #img-zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        #img-zoom-overlay.open {
            display: flex;
        }

        #img-zoom-overlay img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
        }

        /* ─── TOAST ──────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: var(--success);
            color: white;
        }

        .toast.error {
            background: var(--danger);
            color: white;
        }

        /* ─── SCROLLBAR ──────────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* ─── RESPONSIVE ─────────────────────────────── */
        @media (max-width: 600px) {
            .admin-main {
                padding: 15px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .admin-header {
                padding: 0 15px;
            }
        }

        /* ─── STATUS UPDATE IN MODAL ──────────────────── */
        .status-update-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(230, 126, 34, 0.06);
            border: 1px solid rgba(230, 126, 34, 0.2);
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .status-update-bar label {
            font-size: 0.85rem;
            color: var(--gray);
            white-space: nowrap;
        }

        .status-select {
            flex: 1;
            min-width: 180px;
            padding: 9px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .status-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .save-status-btn {
            padding: 9px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .save-status-btn:hover {
            filter: brightness(1.1);
        }

        /* admin status badge */
        .adm-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .adm-received {
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
        }

        .adm-progress {
            background: rgba(230, 126, 34, 0.15);
            color: #E67E22;
        }

        .adm-completed {
            background: rgba(39, 174, 96, 0.15);
            color: #27ae60;
        }

        .adm-shipped {
            background: rgba(155, 89, 182, 0.15);
            color: #9b59b6;
        }

        .adm-delivered {
            background: rgba(39, 174, 96, 0.25);
            color: #27ae60;
        }
    </style>
</head>

<body>
    <!-- Offline / Online Status Banner -->
    <div id="offline-banner"></div>

    <!-- ════════════════════════════════════════
         LOGIN SCREEN
    ════════════════════════════════════════ -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-palette"></i> MagicalArts
            </div>
            <p class="login-subtitle">Admin Panel — Secure Login</p>

            <div class="login-field">
                <label>Secret Key</label>
                <i class="fas fa-key fi"></i>
                <input type="password" id="login-password" placeholder="Enter secret key" style="padding-right:44px"
                    autocomplete="off" readonly onfocus="this.removeAttribute('readonly');"
                    onkeydown="if(event.key === 'Enter') doLogin();">
                <button type="button" class="pwd-toggle" id="pwd-toggle" title="Show/hide password">
                    <i class="fas fa-eye" id="pwd-eye"></i>
                </button>
            </div>

            <div class="login-error" id="login-error">
                <i class="fas fa-exclamation-triangle"></i> Incorrect secret key. Try again.
            </div>

            <button class="login-btn" id="login-btn" onclick="doLogin()">
                <i class="fas fa-sign-in-alt" id="login-btn-icon"></i>
                <span id="login-btn-text">Sign In</span>
            </button>
        </div>
    </div>

    <!-- ════════════════════════════════════════
         ADMIN PANEL
    ════════════════════════════════════════ -->
    <div id="admin-panel">

        <!-- Header -->
        <div class="admin-header">
            <div class="admin-brand">
                <i class="fas fa-palette"></i> MagicalArts Admin
            </div>
            <div class="admin-nav">
                <span><i class="fas fa-user-shield"></i> Admin</span>
                <button class="logout-btn" onclick="doLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="admin-main">

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <i class="fas fa-shopping-bag"></i>
                    <div class="stat-value" id="stat-total">—</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-rupee-sign"></i>
                    <div class="stat-value" id="stat-revenue">—</div>
                    <div class="stat-label">Total Revenue</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-image"></i>
                    <div class="stat-value" id="stat-with-img">—</div>
                    <div class="stat-label">Orders with Photo</div>
                </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, orderBy, query }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBe7jNWvfkNthXnpN6I8UUQwi5Ijfd9lR8",
            authDomain: "magicalarts-18.firebaseapp.com",
            projectId: "magicalarts-18",
            storageBucket: "magicalarts-18.firebasestorage.app",
            messagingSenderId: "168684333077",
            appId: "1:168684333077:web:19582d7010660900d0c61c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // NOTE: enableIndexedDbPersistence removed from admin panel intentionally
        // (admin always needs live data, not cached data)

        // ─── Load all orders ────────────────────────────
        window._loadOrders = async () => {
            try {
                const q = query(collection(db, 'orders'), orderBy('timestamp', 'desc'));
                const snap = await getDocs(q);
                const docs = [];
                snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                return docs;
            } catch (e) {
                // If no index or empty, try without order
                try {
                    const snap = await getDocs(collection(db, 'orders'));
                    const docs = [];
                    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                    return docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                } catch (e2) { return []; }
            }
        };

        // ─── Load all contact messages ───────────────────
        window._loadMessages = async () => {
            try {
                const q = query(collection(db, 'contact_messages'), orderBy('timestamp', 'desc'));
                const snap = await getDocs(q);
                const docs = [];
                snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                return docs;
            } catch (e) {
                try {
                    const snap = await getDocs(collection(db, 'contact_messages'));
                    const docs = [];
                    snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                    return docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                } catch (e2) { return []; }
            }
        };

        // ─── Update order status ─────────────────────────
        window._updateOrder = async (colName, docId, data) => {
            const { updateDoc, doc: fsDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
            await updateDoc(fsDoc(db, colName, docId), data);
        };

        // ─── Delete a document ───────────────────────────
        window._deleteOrder = async (colName, docId) => {
            await deleteDoc(doc(db, colName, docId));
        };
    </script>

    <!-- Offline detection for admin panel -->
    <script>
        (function () {

            function showOffline() {

                banner.innerHTML = '<i class="fas fa-exclamation-triangle"></i>&nbsp; You are offline — Admin actions like delete/update require internet. Reconnect to continue.';
                banner.style.display = 'block';
            }
            function showOnline() {
                banner.classList.add('is-online');
                banner.innerHTML = '<i class="fas fa-check-circle"></i>&nbsp; Connection restored! Admin panel is fully operational.';
                banner.style.display = 'block';
                setTimeout(() => { banner.style.display = 'none'; }, 3500);
            }
            window.addEventListener('offline', showOffline);
            window.addEventListener('online', showOnline);
            if (!navigator.onLine) showOffline();
        })();
    </script>

        // ════════════════════════════════════════

        // ════════════════════════════════════════
        async function loadOrders() {
            document.getElementById('orders-body').innerHTML = `
                <div class="orders-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading orders…</p>
                </div>`;

            if (!window._loadOrders) {
                // Firebase module failed to initialise — wait briefly and retry once
                await new Promise(r => setTimeout(r, 1500));
            }

            try {
                if (!window._loadOrders) throw new Error('Firebase module not ready. Refresh the page.');
                allOrders = await window._loadOrders();
                renderOrders(allOrders);
                updateStats();
            } catch (e) {
                console.error('loadOrders error:', e);
                let hint = '';
                const code = e?.code || e?.message || '';
                if (code.includes('permission-denied') || code.includes('PERMISSION_DENIED')) {
                    hint = '<br><small style="color:#aaa">Fix: Go to <b>Firebase Console → Firestore → Rules</b> and set read/write to <code>allow read, write: if true;</code></small>';
                } else if (code.includes('unavailable') || code.includes('offline')) {
                    hint = '<br><small style="color:#aaa">Check your internet connection and try refreshing.</small>';
                } else if (code.includes('not ready') || code.includes('module')) {
                    hint = '<br><small style="color:#aaa">Firebase did not load. Make sure you opened this via <b>Live Server</b> (http://), not file://</small>';
                } else {
                    hint = `<br><small style="color:#aaa">Error: ${code}</small>`;
                }
                document.getElementById('orders-body').innerHTML = `
                    <div class="orders-empty">
                        <i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i>
                        <p>Failed to load orders.${hint}</p>
                    </div>`;
            }
        }

        function applyFilters() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const sty = document.getElementById('style-filter').value.toLowerCase();

            const filtered = allOrders.filter(o => {
                const matchQ = !q || [o.name, o.email, o.orderId, o.phone].some(v => (v || '').toLowerCase().includes(q));

            renderOrders(filtered);

            const sel = document.getElementById('status-select-' + docId);
            if (!sel) return;
            const newStatus = sel.value;
            try {
                await window._updateOrder('orders', docId, { status: newStatus });
                // Update local cache
                const o = allOrders.find(x => x.id === docId);
                if (o) o.status = newStatus;
                showToast('✅ Status updated to: ' + newStatus, 'success');
            } catch (e) {
                showToast('❌ Failed to update status', 'error');
                console.error(e);
            }
        }

                        <div class="detail-item"><label>Email</label><span>${escHtml(m.email || '—')}</span></div>
                        <div class="detail-item"><label>Phone</label><span>${escHtml(m.phone || '—')}</span></div>
                        <div class="detail-item"><label>Received</label><span>${formatTS(m.timestamp)}</span></div>
                        <div class="detail-item full"><label>Subject</label><span>${escHtml(m.subject || '—')}</span></div>
                        <div class="detail-item full"><label>Message</label><span style="white-space:pre-wrap">${escHtml(m.message || '')}</span></div>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>Attached Reference Image</h4>
                    ${m.imageBase64
                    ? `<img class="ref-img-preview" src="${m.imageBase64}" alt="Reference" onclick="zoomImg('${encodeURIComponent(m.imageBase64)}')">`
                    : `<div class="no-img-placeholder"><i class="fas fa-image"></i><p>No image attached</p></div>`}
                </div>
            `;

            document.getElementById('detail-modal').classList.add('open');
        }

        // ════════════════════════════════════════
        // DELETE
        // ════════════════════════════════════════
        async function deleteOrder(docId, colName) {
            if (!confirm('Are you sure you want to delete this record? This cannot be undone.')) return;
            try {
                await window._deleteOrder(colName, docId);
                showToast('Deleted successfully', 'success');
                if (colName === 'orders') {
                    allOrders = allOrders.filter(o => o.id !== docId);
                    renderOrders(allOrders);
                    updateStats();
                } else {
                    allMessages = allMessages.filter(m => m.id !== docId);
                    renderMessages(allMessages);
                    document.getElementById('stat-contacts').textContent = allMessages.length;
                }
            } catch (e) {
                showToast('Delete failed: ' + e.message, 'error');
            }
        }

        // ════════════════════════════════════════
        // MODAL CLOSE
        // ════════════════════════════════════════
        function closeModal() {
            document.getElementById('detail-modal').classList.remove('open');
        }

        document.getElementById('detail-modal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // ════════════════════════════════════════
        // IMAGE ZOOM
        // ════════════════════════════════════════
        function zoomImg(encoded) {
            document.getElementById('zoom-img').src = decodeURIComponent(encoded);
            document.getElementById('img-zoom-overlay').classList.add('open');
        }

        function closeZoom() {
            document.getElementById('img-zoom-overlay').classList.remove('open');
        }

        // ════════════════════════════════════════
        // TOAST
        // ════════════════════════════════════════
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.className = 'toast', 3000);
        }

        // ════════════════════════════════════════
        // HELPERS
        // ════════════════════════════════════════
        function escHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTS(ts) {
            if (!ts) return '—';
            try {
                const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
                return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch { return '—'; }
        }
    </script>

</body>

</html>
